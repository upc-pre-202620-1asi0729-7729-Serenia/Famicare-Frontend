<main class="auth-page">
  <div class="auth-lang"><app-language-switcher></app-language-switcher></div>

  <section class="auth-card">
    <span class="auth-brand"><img src="famicare-logo.jpg" alt="FamiCare" /></span>
    <h1>{{ 'auth.forgot.title' | translate }}</h1>
    <p class="auth-sub">{{ 'auth.forgot.subtitle' | translate }}</p>

    @if (sent()) {
      <p class="auth-success" role="status">{{ 'auth.forgot.sent' | translate }}</p>
    } @else {
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field" [class.field--invalid]="invalid">
          <label for="fp-email">{{ 'auth.fields.email' | translate }}</label>
          <input id="fp-email" type="email" formControlName="email" autocomplete="email" [placeholder]="'auth.fields.emailPlaceholder' | translate" />
          @if (invalid) { <p class="field__error">{{ 'errors.email' | translate }}</p> }
        </div>

        @if (failed()) { <p class="form-error" role="alert">{{ 'errors.generic' | translate }}</p> }

        <button type="submit" class="coral-button" [disabled]="loading()">{{ 'auth.forgot.submit' | translate }}</button>
      </form>
    }

    <div class="auth-links auth-links--center">
      <a routerLink="/login">{{ 'auth.forgot.back' | translate }}</a>
    </div>
  </section>
</main>
